<!-- main nav bar - only displayed for authenticated accounts -->
<nav class="navbar navbar-expand navbar-dark bg-dark" *ngIf="account">
    <div class="container">
        <div class="navbar-brand">Angular 21 Auth Boilerplate</div>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a routerLink="/" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
                <a routerLink="/profile" class="nav-link">Profile</a>
            </li>
            <li class="nav-item" *ngIf="account?.role === 'Admin'">
                <a routerLink="/admin" class="nav-link">Admin</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" (click)="logout()" style="cursor: pointer;">Logout</a>
            </li>
        </ul>
    </div>
</nav>

<!-- subnav outlet - used by admin section -->
<router-outlet name="subnav"></router-outlet>

<!-- global alert component -->
<alert></alert>

<!-- main router outlet -->
<div class="container">
    <router-outlet></router-outlet>
</div>
